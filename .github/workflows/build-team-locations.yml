name: Build Team Location Registry

on:
  schedule:
    # Weekly refresh — Sunday 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build team location registry
        env:
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
        run: python scripts/build_team_locations.py --refresh

      - name: Commit registry updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/team_locations/registry.json assets/team_locations/registry.meta.json
          if git diff --staged --quiet; then
            echo "No registry changes to commit"
          else
            git commit \
              -m "chore: refresh team location registry" \
              -m "Automated weekly rebuild via TheSportsDB premium API."
            git push
          fi
