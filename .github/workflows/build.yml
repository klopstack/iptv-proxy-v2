name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: klopstack/iptv-proxy-v2

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate GitHub Actions workflow YAML
        run: |
          pip install pyyaml
          python - <<'PY'
          import pathlib
          import sys
          import yaml

          errors = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("All workflow files parsed successfully.")
          PY

  lint-py:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    # Exit-zero treats all errors as warnings
    - name: Install Python deps via Makefile
      run: make install-py

    - name: Run linters via Makefile
      run: make lint-py

  lint-js:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install JS deps
      run: make install-js

    - name: Run JS linters
      run: make lint-js

  test-js:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install JS deps
      run: make install-js

    - name: Run JavaScript unit tests
      run: make test-js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies via Makefile
        run: make install

      - name: Verify required static assets
        run: test -f static/js/mpegts.min.js

      - name: Run tests with coverage via Makefile
        run: make test

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [lint-py]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iptv_test
          POSTGRES_USER: iptv
          POSTGRES_PASSWORD: iptv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iptv -d iptv_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://iptv:iptv@localhost:5432/iptv_test
      FLASK_APP: app.py
      DISABLE_IN_WORKER_SCHEDULER: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies via Makefile
        run: make install-py

      - name: Apply Alembic migrations
        run: venv/bin/flask db upgrade

      - name: Run tests (non-SQLite)
        run: venv/bin/pytest tests/ -m "not sqlite_only" -x -v --cov=. --cov-report=term-missing --cov-fail-under=75

  vulture:
    name: Dead code scan (vulture)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps via Makefile
        run: make install-py

      - name: Run vulture
        run: make vulture

  docker-build-smoke:
    name: Docker build (PR smoke)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-workflows, lint-py, lint-js, test-js, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: iptv-proxy-v2:pr-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    needs: [validate-workflows, lint-py, lint-js, test-js, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
