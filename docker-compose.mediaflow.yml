# Docker Compose override for MediaFlow Proxy backend
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.mediaflow.yml up -d
#
# This override:
# - Sets STREAM_BACKEND=mediaflow
# - Enables the mediaflow-proxy service
# - Configures pre-buffering for optimal IPTV performance

services:
  iptv-proxy-v2:
    environment:
      STREAM_BACKEND: "mediaflow"
      MEDIAFLOW_PROXY_URL: "http://localhost:8888"
      MEDIAFLOW_API_PASSWORD: "${MEDIAFLOW_API_PASSWORD:-iptv-proxy-secret}"

  mediaflow-proxy:
    # Remove the profile restriction so it always starts
    profiles: []
    environment:
      API_PASSWORD: "${MEDIAFLOW_API_PASSWORD:-iptv-proxy-secret}"
      # Aggressive pre-buffering for live IPTV
      ENABLE_HLS_PREBUFFER: "true"
      HLS_PREBUFFER_SEGMENTS: "8"
      HLS_PREBUFFER_CACHE_SIZE: "100"
      HLS_PREBUFFER_MAX_MEMORY_PERCENT: "70"
      # Emergency cleanup threshold
      HLS_PREBUFFER_EMERGENCY_THRESHOLD: "85"
