services:
  iptv-proxy-v2:
    build: .
    container_name: iptv-proxy-v2
    restart: unless-stopped
    network_mode: "host"  # Use host network to avoid Docker NAT issues with IPTV streams
    volumes:
      - ./data:/app/data
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
    environment:
      PORT: "8000"
      DEBUG: "False"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/iptv_proxy.db}"
      MEDIAFLOW_PROXY_URL: "${MEDIAFLOW_PROXY_URL:-http://localhost:8888}"
      MEDIAFLOW_API_PASSWORD: "${MEDIAFLOW_API_PASSWORD:-iptv-proxy-secret}"
      TRANSCODE_HWACCEL: "${TRANSCODE_HWACCEL:-auto}"
    user: "${PUID:-1000}:${PGID:-1000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      mediaflow-proxy:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:16-alpine
    container_name: iptv-proxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-iptv_proxy}"
      POSTGRES_USER: "${POSTGRES_USER:-iptv}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iptv} -d ${POSTGRES_DB:-iptv_proxy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  mediaflow-proxy:
    image: mhdzumair/mediaflow-proxy:latest
    container_name: mediaflow-proxy
    restart: unless-stopped
    network_mode: "host"
    environment:
      API_PASSWORD: "${MEDIAFLOW_API_PASSWORD:-iptv-proxy-secret}"
      ENABLE_HLS_PREBUFFER: "true"
      HLS_PREBUFFER_SEGMENTS: "8"
      HLS_PREBUFFER_CACHE_SIZE: "100"
      HLS_PREBUFFER_MAX_MEMORY_PERCENT: "70"
      HLS_PREBUFFER_EMERGENCY_THRESHOLD: "85"
      ENABLE_DASH_PREBUFFER: "true"
      DASH_PREBUFFER_SEGMENTS: "5"
      ENABLE_STREAMING_PROGRESS: "false"
      FORWARDED_ALLOW_IPS: "127.0.0.1"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8888/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
