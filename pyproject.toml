[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']
exclude = '''
/(
    \.git
  | __pycache__
  | \.venv
  | venv
  | env
  | \.pytest_cache
  | instance
  | data
  | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
known_first_party = ["app", "models", "services", "routes", "schemas", "error_handling"]
force_single_line = false
use_parentheses = true
ensure_newline_before_comments = true
indent = 4

[tool.pytest.ini_options]
# pytest-randomly (requirements-dev.txt) shuffles collection order by default.
# Reproduce a failure: pytest ... --randomly-seed=<seed from output>
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    # Suppress Flask-SQLAlchemy's internal legacy API warning
    # This comes from Flask-SQLAlchemy 3.1.1 maintaining backward compatibility
    # with the old Model.query interface. It won't cause test failures and is
    # outside our control (Flask-SQLAlchemy internal code).
    "ignore::sqlalchemy.exc.LegacyAPIWarning:flask_sqlalchemy.query",
    # Suppress dateparser library deprecation warning about parsing dates without years
    # This is a Python 3.15 future warning from the dateparser library's use of strptime
    # The library needs to be updated by its maintainers
    "ignore:Parsing dates involving a day of month without a year:DeprecationWarning",
]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --cov=. --cov-report=html --cov-report=term-missing --cov-fail-under=75"
markers = [
    "integration: marks tests requiring external services (deselect with '-m \"not integration\"')",
    "migrations: marks tests that run the full migration chain on a temp database",
    "legacy_migrations: marks tests for archived sqlite3 migration runner",
    "sqlite_only: marks tests that require SQLite backend (skipped on PostgreSQL CI)",
    "network: marks tests that intentionally call external HTTP APIs (e.g. live TheSportsDB)",
]
norecursedirs = ["services", "routes", "migrations", "static", "templates", "data", "instance", "venv"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/.venv/*",
    "*/instance/*",
    "*/data/*",
    "scripts/*",
    "migrations/legacy_sqlite/*",
    "alembic_migrations/*",
    "vulture_whitelist.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false  # Disabled: API clients commonly return Any from JSON responses
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = [
    "venv",
    "env",
    ".venv",
    "tests",
    "vulture_whitelist.py",
]
